name: CI

# Two things happen here, and the second is the one that has actually caught
# problems: the code is checked, and then the deployment is checked against the
# commit that triggered it. A push whose Vercel hook silently never fires leaves
# the previous build serving happily — healthy to every probe, and wrong.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `prisma generate` runs on postinstall. It reads the schema only, so no
      # database URL is needed and CI holds no secrets.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test --if-present

      - run: npm run build

  verify-deploy:
    name: Verify the deployed commit
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Override with a repository variable if the production URL changes.
      DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL || 'https://kmcp.vercel.app' }}

    steps:
      - name: Wait for the deployment to report this commit
        run: |
          set -uo pipefail
          expected="${GITHUB_SHA}"
          url="${DEPLOYMENT_URL%/}/api/health"
          echo "Expecting ${expected} at ${url}"

          for attempt in $(seq 1 40); do
            body="$(curl -fsS --max-time 15 "$url" 2>/dev/null || true)"
            commit="$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)"

            if [ "$commit" = "$expected" ]; then
              echo "Deployed commit matches after ${attempt} attempt(s)."
              exit 0
            fi

            echo "attempt ${attempt}/40 — deployed: ${commit:-unreachable}"
            sleep 15
          done

          echo "::error::${url} never reported ${expected}. The deploy did not happen, or it deployed something else."
          exit 1
